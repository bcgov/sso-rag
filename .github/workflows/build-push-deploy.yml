name: Terraform

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "ui/**"
      - "terraform/**"
      - ".github/workflows/build-push-deploy.yml"
env:
  TF_VERSION: 1.15.5
  TF_VAR_knowledge_base_id: ${{ secrets.AWS_BEDROCK_KNOWLEDGE_BASE_ID }}

jobs:
  terraform:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        env:
          TERRAFORM_DEPLOY_ROLE_ARN: ${{ secrets.TERRAFORM_DEPLOY_ROLE_ARN_SANDBOX }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push API Image to ECR
        env:
          AWS_ECR_SSO_RAG_API_REPO_URI: ${{ secrets.AWS_ECR_SSO_RAG_API_REPO_URI }}
        working-directory: .
        run: |
          docker build -t ${{ env.AWS_ECR_SSO_RAG_API_REPO_URI }}:latest .
          docker push ${{ env.AWS_ECR_SSO_RAG_API_REPO_URI }}:latest

      - name: Build, Tag, and Push UI Image to ECR
        env:
          AWS_ECR_SSO_RAG_UI_REPO_URI: ${{ secrets.AWS_ECR_SSO_RAG_UI_REPO_URI }}
        working-directory: ./ui
        run: |
          docker build -t ${{ env.AWS_ECR_SSO_RAG_UI_REPO_URI }}:latest .
          docker push ${{ env.AWS_ECR_SSO_RAG_UI_REPO_URI }}:latest

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          cat <<EOF > backend.hcl
          bucket = "sso-rag-tfstate"
          key = "tfstate"
          region = "ca-central-1"
          EOF
          terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        run: terraform plan -no-color
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

      # Images are pushed as :latest, which doesn't change the task definition,
      # so ECS has to be told to pull the new images.
      - name: Roll out new images
        working-directory: ./terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          for SERVICE in sso-rag-api sso-rag-ui; do
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment > /dev/null
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services sso-rag-api sso-rag-ui
